name: Build Translations

on:
  workflow_dispatch:
  push:
    branches:
      - update-translations
    paths:
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'packages/**/*.js'
      - '!packages/tools/locales/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  build-translations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: update-translations
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext translate-toolkit

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run buildTranslations
        run: yarn buildTranslations

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/tools/locales/*.pot packages/tools/locales/*.po packages/lib/locales/
          git commit -m "chore: update translations from source code"
          git push

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: update translations from source code'
          title: 'chore: update translations'
          body: |
            ## Translation Update
            
            This PR updates the translation files based on the latest strings in the codebase.
            
            ### Changes
            - Updated `joplin.pot` with new/modified strings
            - Merged changes into all language-specific `.po` files
            - Regenerated JSON locale files
            
            ### Files Modified
            - `packages/tools/locales/joplin.pot`
            - `packages/tools/locales/*.po` (all language files)
            - `packages/lib/locales/*.json`
            
            ### Next Steps
            1. Review the changes
            2. Upload the updated `.pot` and `.po` files to Crowdin for translation
            3. Merge this PR once translations are confirmed
          branch: update-translations
          base: dev
          delete-branch: false
